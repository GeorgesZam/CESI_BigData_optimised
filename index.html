<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Max users before saturation</title>
  <style>
    :root { color-scheme: light; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 2rem auto; max-width: 60rem; padding: 0 1rem; line-height: 1.5; color: #1f2328; }
    h1 { font-size: 1.6rem; margin-bottom: 0.2rem; }
    p.sub { color: #59636e; margin-top: 0; }
    .chart { position: relative; height: 24rem; margin: 1.5rem 0; }
    table { border-collapse: collapse; width: 100%; font-size: 0.92rem; }
    th, td { border-bottom: 1px solid #d1d9e0; padding: 0.45rem 0.6rem; text-align: left; }
    th { background: #f6f8fa; font-weight: 600; }
    td.num, th.num { text-align: right; }
    .postgres { color: #0969da; font-weight: 600; }
    .duckdb { color: #bc4c00; font-weight: 600; }
    .empty { padding: 2rem; text-align: center; color: #59636e; }
  </style>
</head>
<body>
  <h1>Maximum users before saturation</h1>
  <p class="sub">One user = one request per second. The ramp stops at the first failure: CPU, memory, response time or errors.</p>
  <div class="chart"><canvas id="chart"></canvas></div>
  <div id="empty" class="empty" hidden>No run recorded yet.</div>
  <table id="results" hidden>
    <thead>
      <tr><th>Date</th><th>Engine</th><th class="num">Max users</th><th>Blocking reason</th></tr>
    </thead>
    <tbody></tbody>
  </table>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
  <script>
    const COLORS = { postgres: "#0969da", duckdb: "#bc4c00" };
    const LABELS = { postgres: "PostgreSQL", duckdb: "DuckDB" };

    function shortCommit(commit) {
      return commit ? commit.slice(0, 7) : "local";
    }

    async function main() {
      let history = [];
      try {
        const response = await fetch("history.json", { cache: "no-store" });
        if (response.ok) history = await response.json();
      } catch (error) {
        console.error(error);
      }

      if (!history.length) {
        document.getElementById("empty").hidden = false;
        return;
      }

      document.getElementById("results").hidden = false;
      const body = document.querySelector("#results tbody");
      history.slice().sort((a, b) => b.date.localeCompare(a.date)).forEach((entry) => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${entry.date.replace("T", " ").replace("Z", "")}</td>
          <td class="${entry.engine}">${LABELS[entry.engine] || entry.engine}</td>
          <td class="num">${entry.max_users}</td>
          <td>${entry.reason_text || entry.reason || ""}</td>`;
        body.appendChild(row);
      });

      const engines = [...new Set(history.map((entry) => entry.engine))];
      const datasets = engines.map((engine) => ({
        label: LABELS[engine] || engine,
        data: history
          .filter((entry) => entry.engine === engine)
          .map((entry) => ({
            x: entry.date,
            y: entry.max_users,
            reason: entry.reason_text || entry.reason,
            commit: shortCommit(entry.commit),
          })),
        backgroundColor: COLORS[engine] || "#57606a",
        borderColor: COLORS[engine] || "#57606a",
        pointRadius: 6,
        pointHoverRadius: 8,
      }));

      new Chart(document.getElementById("chart"), {
        type: "scatter",
        data: { datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: {
              type: "time",
              time: { tooltipFormat: "yyyy-MM-dd HH:mm" },
              title: { display: true, text: "date" },
              ticks: { maxRotation: 0, autoSkip: true },
            },
            y: {
              beginAtZero: true,
              title: { display: true, text: "max users" },
              ticks: { precision: 0 },
            },
          },
          plugins: {
            legend: { position: "bottom" },
            tooltip: {
              callbacks: {
                label: (context) => {
                  const point = context.raw;
                  return `${context.dataset.label}: ${point.y} users (${point.reason}) — ${point.commit}`;
                },
              },
            },
          },
        },
      });
    }

    main();
  </script>
</body>
</html>
