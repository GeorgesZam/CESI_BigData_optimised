<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Max users before saturation</title>
  <style>
    :root { color-scheme: light; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; padding: 2rem 1rem 3rem; background: #f6f8fa; color: #1f2328; line-height: 1.5; }
    main { max-width: 68rem; margin: 0 auto; }
    h1 { font-size: 1.6rem; margin: 0 0 0.2rem; }
    p.sub { color: #59636e; margin: 0 0 1.5rem; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(20rem, 1fr)); gap: 1.25rem; }
    .card { background: #ffffff; border: 1px solid #d1d9e0; border-radius: 10px; padding: 1.1rem 1.2rem 1.3rem; }
    .card h2 { font-size: 1.1rem; margin: 0; display: flex; align-items: baseline; justify-content: space-between; gap: 0.5rem; }
    .badge { font-size: 1.4rem; font-weight: 700; }
    .postgres { color: #0969da; }
    .duckdb { color: #bc4c00; }
    .blocked { color: #59636e; margin: 0.2rem 0 0.8rem; font-size: 0.92rem; }
    .chart { position: relative; height: 16rem; }
    table { width: 100%; border-collapse: collapse; background: #ffffff; border: 1px solid #d1d9e0; border-radius: 10px; overflow: hidden; font-size: 0.9rem; margin-top: 1.5rem; }
    th, td { border-bottom: 1px solid #d1d9e0; padding: 0.5rem 0.65rem; text-align: left; }
    th { background: #f6f8fa; font-weight: 600; }
    td.num, th.num { text-align: right; }
    tr:last-child td { border-bottom: 0; }
    td.change { color: #59636e; }
    .empty { padding: 3rem 1rem; text-align: center; color: #59636e; background: #ffffff; border: 1px solid #d1d9e0; border-radius: 10px; }
  </style>
</head>
<body>
<main>
  <h1>Maximum users before saturation</h1>
  <p class="sub">One user = one request per second. The ramp stops at the first failure: CPU, memory, response time or errors.</p>

  <div id="empty" class="empty" hidden>No run recorded yet.</div>

  <div class="cards" id="cards" hidden>
    <section class="card">
      <h2>PostgreSQL <span class="badge postgres" id="postgres-value">–</span></h2>
      <p class="blocked" id="postgres-reason">no run yet</p>
      <div class="chart"><canvas id="postgres-chart"></canvas></div>
    </section>
    <section class="card">
      <h2>DuckDB <span class="badge duckdb" id="duckdb-value">–</span></h2>
      <p class="blocked" id="duckdb-reason">no run yet</p>
      <div class="chart"><canvas id="duckdb-chart"></canvas></div>
    </section>
  </div>

  <table id="results" hidden>
    <thead>
      <tr><th>Date</th><th>Engine</th><th class="num">Max users</th><th>Blocking reason</th><th>Change</th></tr>
    </thead>
    <tbody></tbody>
  </table>
</main>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
  const COLORS = { postgres: "#0969da", duckdb: "#bc4c00" };
  const LABELS = { postgres: "PostgreSQL", duckdb: "DuckDB" };

  function shortCommit(commit) {
    return commit ? commit.slice(0, 7) : "local";
  }

  function dayOf(entry) {
    return entry.date.slice(0, 10);
  }

  function niceMax(value) {
    return Math.max(10, Math.ceil(value / 50) * 50);
  }

  async function main() {
    let history = [];
    try {
      const response = await fetch("history.json", { cache: "no-store" });
      if (response.ok) history = await response.json();
    } catch (error) {
      console.error(error);
    }

    if (!history.length) {
      document.getElementById("empty").hidden = false;
      return;
    }

    document.getElementById("cards").hidden = false;
    document.getElementById("results").hidden = false;

    const body = document.querySelector("#results tbody");
    history.slice().sort((a, b) => b.date.localeCompare(a.date)).forEach((entry) => {
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${entry.date.replace("T", " ").replace("Z", "")}</td>
        <td class="${entry.engine}">${LABELS[entry.engine] || entry.engine}</td>
        <td class="num">${entry.max_users}</td>
        <td>${entry.reason_text || entry.reason || ""}</td>
        <td class="change">${entry.commit_message || shortCommit(entry.commit)}</td>`;
      body.appendChild(row);
    });

    const days = [...new Set(history.map(dayOf))].sort();
    const maxUsers = Math.max(...history.map((entry) => entry.max_users));
    const yMax = niceMax(maxUsers);

    function entryFor(engine, day) {
      return history
        .filter((entry) => entry.engine === engine && dayOf(entry) === day)
        .sort((a, b) => a.date.localeCompare(b.date))
        .at(-1);
    }

    function latestFor(engine) {
      return history
        .filter((entry) => entry.engine === engine)
        .sort((a, b) => a.date.localeCompare(b.date))
        .at(-1);
    }

    function draw(engine) {
      const latest = latestFor(engine);
      if (!latest) return;
      document.getElementById(`${engine}-value`).textContent = `${latest.max_users} users`;
      document.getElementById(`${engine}-reason`).textContent =
        latest.reason === "none"
          ? "no failure within the ramp"
          : `blocked by ${latest.reason_text || latest.reason}`;

      new Chart(document.getElementById(`${engine}-chart`), {
        type: "line",
        data: {
          labels: days,
          datasets: [{
            label: LABELS[engine],
            data: days.map((day) => {
              const entry = entryFor(engine, day);
              return entry ? entry.max_users : null;
            }),
            borderColor: COLORS[engine],
            backgroundColor: COLORS[engine],
            borderWidth: 2,
            spanGaps: true,
            tension: 0.2,
            fill: false,
            pointRadius: 5,
            pointHoverRadius: 7,
          }],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: (context) => {
                  const entry = entryFor(engine, context.label);
                  if (!entry) return "";
                  const message = entry.commit_message ? ` — ${entry.commit_message}` : "";
                  return `${entry.max_users} users (${entry.reason_text || entry.reason})${message}`;
                },
              },
            },
          },
          scales: {
            x: { title: { display: true, text: "date" }, ticks: { maxRotation: 0 } },
            y: { beginAtZero: true, max: yMax, title: { display: true, text: "max users" }, ticks: { precision: 0 } },
          },
        },
      });
    }

    draw("postgres");
    draw("duckdb");
  }

  main();
</script>
</body>
</html>
