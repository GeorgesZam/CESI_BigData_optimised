name: DuckDB performance

on:
  workflow_dispatch:
    inputs:
      enforce_budget:
        description: Fail the job when the max-users criterion fails
        type: boolean
        default: false
      note:
        description: What changed to improve performance
        type: string
        default: ""

concurrency:
  group: db-performance-duckdb-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  DUMP_PATH: "DATA 2024/BDD PostgreSQL/DATA2023"

jobs:
  duckdb-stress:
    name: DuckDB max users
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cesi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cesi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: cesi
      SOURCE_DSN: "host=localhost port=5432 dbname=cesi user=postgres password=postgres"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bench/requirements.txt

      - name: Install dependencies
        run: pip install -r bench/requirements.txt

      - name: Locate the database dump
        env:
          DUMP_URL: ${{ vars.DUMP_URL }}
        run: |
          set -euo pipefail
          dump="$RUNNER_TEMP/cesi.dump"
          if [ -n "${DUMP_URL:-}" ]; then
            curl -fsSL "$DUMP_URL" -o "$dump"
          elif [ -f "$DUMP_PATH" ]; then
            cp "$DUMP_PATH" "$dump"
          else
            echo "::error::No dump found. Commit '$DUMP_PATH' or set the DUMP_URL repository variable."
            exit 1
          fi
          echo "DUMP_FILE=$dump" >> "$GITHUB_ENV"

      - name: Restore the dump
        run: |
          set -euo pipefail
          pg_restore -j 4 --no-owner --no-privileges --exit-on-error -d "$PGDATABASE" "$DUMP_FILE"

      - name: Build the DuckDB file
        run: |
          python bench/build_duckdb.py --dsn "$SOURCE_DSN" --out /tmp/cesi.duckdb

      - name: Run the stress test
        env:
          NOTE: ${{ inputs.note }}
        run: |
          set -euo pipefail
          message="${NOTE:-$(git log -1 --format=%s)}"
          extra=""
          if [ "${{ inputs.enforce_budget }}" = "true" ]; then
            extra="--strict"
          fi
          python bench/duckdb_stress.py \
            --db /tmp/cesi.duckdb \
            --thresholds bench/thresholds.json \
            --engine duckdb \
            --commit "$GITHUB_SHA" \
            --commit-message "$message" \
            --branch "$GITHUB_REF_NAME" \
            --md-out bench/stress-report.md \
            --json-out bench/stress.json \
            --history-entry-out bench/history-entry.json $extra

      - name: Publish the report to the job summary
        if: always()
        run: |
          if [ -f bench/stress-report.md ]; then
            cat bench/stress-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish the result to gh-pages
        if: success()
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          rm -rf /tmp/gh-pages
          git worktree add --detach /tmp/gh-pages origin/gh-pages
          python bench/publish_history.py \
            --history /tmp/gh-pages/history.json \
            --entry bench/history-entry.json
          cd /tmp/gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          if git diff --cached --quiet; then
            echo "history unchanged"
          else
            git commit -m "chore(bench): record DuckDB max users [skip ci]"
            git push origin HEAD:gh-pages
          fi
          cd "$GITHUB_WORKSPACE"
          git worktree remove --force /tmp/gh-pages

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duckdb-stress-report
          path: |
            bench/stress-report.md
            bench/stress.json
            bench/history-entry.json
          if-no-files-found: warn
