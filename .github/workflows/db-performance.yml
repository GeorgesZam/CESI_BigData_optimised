name: Database performance

on:
  workflow_dispatch:
    inputs:
      enforce_budget:
        description: Fail the job when an acceptance criterion fails
        type: boolean
        default: false
      update_baseline:
        description: Record this run as the new reference baseline
        type: boolean
        default: false
      note:
        description: What changed to improve performance
        type: string
        default: ""

concurrency:
  group: db-performance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  DUMP_PATH: "DATA 2024/BDD PostgreSQL/DATA2023"

jobs:
  benchmark:
    name: Latency benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cesi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cesi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: cesi
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cesi

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bench/requirements.txt

      - name: Install benchmark dependencies
        run: pip install -r bench/requirements.txt

      - name: Locate the database dump
        env:
          DUMP_URL: ${{ vars.DUMP_URL }}
        run: |
          set -euo pipefail
          dump="$RUNNER_TEMP/cesi.dump"
          if [ -n "${DUMP_URL:-}" ]; then
            curl -fsSL "$DUMP_URL" -o "$dump"
          elif [ -f "$DUMP_PATH" ]; then
            cp "$DUMP_PATH" "$dump"
          else
            echo "::error::No dump found. Commit '$DUMP_PATH' or set the DUMP_URL repository variable."
            exit 1
          fi
          echo "DUMP_FILE=$dump" >> "$GITHUB_ENV"

      - name: Restore the dump
        run: |
          set -euo pipefail
          pg_restore -j 4 --no-owner --no-privileges --exit-on-error -d "$PGDATABASE" "$DUMP_FILE"
          psql -X -c 'select count(*) as consultations from public."Consultation";'

      - name: Build medallion layers
        run: |
          python bench/build_layers.py \
            --dsn "$DATABASE_URL" \
            --json-out bench/etl.json \
            --md-out bench/etl-report.md
          cat bench/etl-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Run the benchmark
        run: |
          set -euo pipefail
          args=(
            --dsn "$DATABASE_URL"
            --dump "$DUMP_FILE"
            --repeats 3
            --baseline bench/baseline.json
            --json-out bench/results.json
            --report-out bench/report.md
            --action-out bench/action.json
          )
          if [ "${{ inputs.update_baseline }}" = "true" ]; then
            args+=(--write-baseline bench/baseline.json --commit "$GITHUB_SHA")
          fi
          if [ "${{ inputs.enforce_budget }}" = "true" ]; then
            args+=(--strict)
          fi
          python bench/benchmark.py "${args[@]}"

      - name: Publish the report to the job summary
        if: always()
        run: |
          if [ -f bench/report.md ]; then
            cat bench/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Record the new baseline
        if: github.event_name == 'workflow_dispatch' && inputs.update_baseline && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p reports
          cp bench/report.md reports/latest.md
          git add bench/baseline.json reports/latest.md
          if git diff --cached --quiet; then
            echo "Baseline unchanged"
          else
            git commit -m "chore(bench): update performance baseline [skip ci]"
            git push
          fi

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-performance-report
          path: |
            bench/report.md
            bench/results.json
            bench/baseline.json
            bench/etl.json
            bench/etl-report.md
          if-no-files-found: warn

  stress:
    name: Max users
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: cesi
        ports:
          - 5432:5432
        options: >-
          --memory=2g
          --memory-swap=2g
          --health-cmd "pg_isready -U postgres -d cesi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: cesi
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cesi
      STRESS_URL: postgresql://postgres:postgres@127.0.0.1:6543/cesi

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bench/requirements.txt

      - name: Install benchmark dependencies
        run: pip install -r bench/requirements.txt

      - name: Locate the database dump
        env:
          DUMP_URL: ${{ vars.DUMP_URL }}
        run: |
          set -euo pipefail
          dump="$RUNNER_TEMP/cesi.dump"
          if [ -n "${DUMP_URL:-}" ]; then
            curl -fsSL "$DUMP_URL" -o "$dump"
          elif [ -f "$DUMP_PATH" ]; then
            cp "$DUMP_PATH" "$dump"
          else
            echo "::error::No dump found. Commit '$DUMP_PATH' or set the DUMP_URL repository variable."
            exit 1
          fi
          echo "DUMP_FILE=$dump" >> "$GITHUB_ENV"

      - name: Restore the dump
        run: |
          set -euo pipefail
          pg_restore -j 4 --no-owner --no-privileges --exit-on-error -d "$PGDATABASE" "$DUMP_FILE"

      - name: Build medallion layers
        run: |
          python bench/build_layers.py \
            --dsn "$DATABASE_URL" \
            --json-out bench/etl.json \
            --md-out bench/etl-report.md
          cat bench/etl-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Find the PostgreSQL container
        run: |
          container="$(docker ps --filter ancestor=postgres:14 --format '{{.Names}}' | head -1)"
          echo "PG_CONTAINER=$container" >> "$GITHUB_ENV"
          echo "container: $container"

      - name: Start PgBouncer
        run: |
          set -euo pipefail
          ulimit -n 200000
          sudo apt-get update -qq
          sudo apt-get install -y -qq pgbouncer
          sudo systemctl stop pgbouncer 2>/dev/null || true
          sudo systemctl disable pgbouncer 2>/dev/null || true
          cat > /tmp/pgbouncer.ini <<'EOF'
          [databases]
          cesi = host=127.0.0.1 port=5432 dbname=cesi
          [pgbouncer]
          listen_addr = 127.0.0.1
          listen_port = 6543
          auth_type = trust
          auth_file = /tmp/userlist.txt
          pool_mode = transaction
          max_client_conn = 100000
          default_pool_size = 90
          logfile = /tmp/pgbouncer.log
          pidfile = /tmp/pgbouncer.pid
          EOF
          printf '"postgres" "postgres"\n' > /tmp/userlist.txt
          pgbouncer -d /tmp/pgbouncer.ini || { cat /tmp/pgbouncer.log; exit 1; }
          pgrep -a pgbouncer || true
          grep auth_type /tmp/pgbouncer.ini
          for attempt in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 6543 -U postgres -d cesi; then
              break
            fi
            sleep 1
          done
          echo "psql through PgBouncer:"
          psql "$STRESS_URL" -X -c "select 1"
          echo "psycopg through PgBouncer:"
          python - <<'PY'
          import os
          import psycopg

          with psycopg.connect(os.environ["STRESS_URL"]) as connection:
              print(connection.execute("select 1").fetchone())
          PY

      - name: Run the stress test
        env:
          NOTE: ${{ inputs.note }}
        run: |
          set -euo pipefail
          ulimit -n 200000
          message="${NOTE:-$(git log -1 --format=%s)}"
          extra=""
          if [ "${{ inputs.enforce_budget }}" = "true" ]; then
            extra="--strict"
          fi
          python bench/stress.py \
            --dsn "$STRESS_URL" \
            --thresholds bench/thresholds.json \
            --engine postgres \
            --container "$PG_CONTAINER" \
            --commit "$GITHUB_SHA" \
            --commit-message "$message" \
            --branch "$GITHUB_REF_NAME" \
            --md-out bench/stress-report.md \
            --json-out bench/stress.json \
            --history-entry-out bench/history-entry.json $extra

      - name: Publish the report to the job summary
        if: always()
        run: |
          if [ -f bench/stress-report.md ]; then
            cat bench/stress-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish the result to gh-pages
        if: success()
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          rm -rf /tmp/gh-pages
          git worktree add --detach /tmp/gh-pages origin/gh-pages
          python bench/publish_history.py \
            --history /tmp/gh-pages/history.json \
            --entry bench/history-entry.json
          cd /tmp/gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          if git diff --cached --quiet; then
            echo "history unchanged"
          else
            git commit -m "chore(bench): record max users [skip ci]"
            git push origin HEAD:gh-pages
          fi
          cd "$GITHUB_WORKSPACE"
          git worktree remove --force /tmp/gh-pages

      - name: Upload the stress report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-stress-report
          path: |
            bench/stress-report.md
            bench/stress.json
            bench/history-entry.json
            bench/etl.json
            bench/etl-report.md
          if-no-files-found: warn
